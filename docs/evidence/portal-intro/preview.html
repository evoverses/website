<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0c0a14;color:white;font-family:Arial}main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:20px;box-sizing:border-box}p{text-align:center;max-width:650px;line-height:1.5}.scene {
  position: relative;
  isolation: isolate;
  width: 100%;
  max-width: 960px;
  aspect-ratio: 1.6;
  perspective: 1000px;
}
.vortex {
  position: absolute;
  inset: -4% 13%;
  border-radius: 50%;
  opacity: 0;
  transform: scale(0);
  animation: portal-life 2.8s cubic-bezier(.22,.8,.28,1) both;
  pointer-events: none;
}
.surface, .flow, .counterflow {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
}
.surface {
  background: radial-gradient(ellipse, transparent 0% 43%, #4838ba66 52%, #1279bdaa 61%, #26edff55 70%, transparent 79%);
  filter: blur(16px);
}
.flow { animation: swirl 2.8s ease-in both; }
.counterflow {
  inset: 3%;
  width: 94%;
  height: 94%;
  background: repeating-conic-gradient(from 25deg, transparent 0deg 24deg, #5429eb55 35deg, #59efff88 42deg, transparent 60deg);
  mask-image: radial-gradient(ellipse, transparent 0% 45%, #0009 54%, #000 63%, transparent 76%);
  filter: blur(12px);
  animation: undertow 2.8s ease-in both;
  mix-blend-mode: screen;
}
.logo {
  position: absolute;
  inset: 5% 9%;
  display: grid;
  place-items: center;
  animation: emerge 2.8s cubic-bezier(.18,.72,.22,1) both;
}
.image { width: 100%; height: auto; object-fit: contain; }
@keyframes portal-life {
  0%, 4% { opacity: 0; transform: rotate(-18deg) scale(.02); }
  20% { opacity: 1; transform: rotate(-14deg) scale(.9); }
  35%, 61% { opacity: 1; transform: rotate(-10deg) scale(1); }
  78% { opacity: .95; transform: rotate(4deg) scale(.55); }
  94%, 100% { opacity: 0; transform: rotate(24deg) scale(0); }
}
@keyframes swirl { from { transform: rotate(0deg); } to { transform: rotate(570deg); } }
@keyframes undertow { from { transform: rotate(30deg) scale(.94); } to { transform: rotate(380deg) scale(1.08); } }
@keyframes emerge {
  0%, 20% { opacity: 0; transform: translateZ(-550px) scale(.08) rotateY(-20deg); filter: blur(7px); }
  38% { opacity: .8; transform: translateZ(-180px) scale(.42) rotateY(-12deg); filter: blur(2px); }
  62% { opacity: 1; transform: translateZ(60px) scale(1.04) rotateY(3deg); filter: blur(0); }
  78%, 100% { opacity: 1; transform: translateZ(0) scale(1) rotateY(0); filter: blur(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vortex { display: none; animation: none; }
  .flow, .counterflow { animation: none; }
  .logo { animation: none; opacity: 1; transform: none; filter: none; }
}
</style></head><body><main><div class="scene"><div class="vortex"><div class="surface"></div><img class="flow" src="../../../apps/website/public/landing/portal-flow.svg" alt=""><div class="counterflow"></div></div><div class="logo"><img class="image" src="../../../apps/website/public/landing/evoverses-logo.png" alt="EvoVerses"></div></div><p>A 3D monster battling game bringing Web2 and Web3 together in one platform.</p></main></body></html>
